    <script>
      (function() {
        if (typeof window !== 'undefined') {
          var OriginalWS = window.WebSocket;
          if (OriginalWS) {
            window.WebSocket = function(url, protocols) {
              if (protocols === 'vite-hmr' || (typeof url === 'string' && (url.includes('vite-hmr') || url.includes('token=')))) {
                var listeners = {};
                return {
                  readyState: 1,
                  OPEN: 1,
                  CLOSED: 3,
                  CLOSING: 2,
                  CONNECTING: 0,
                  send: function() {},
                  close: function() {
                    if (listeners['close']) listeners['close'].forEach(function(fn) { fn({ wasClean: true }); });
                  },
                  addEventListener: function(type, fn) {
                    listeners[type] = listeners[type] || [];
                    listeners[type].push(fn);
                    if (type === 'open') {
                      setTimeout(function() { fn({}); }, 0);
                    }
                  },
                  removeEventListener: function(type, fn) {
                    if (listeners[type]) {
                      listeners[type] = listeners[type].filter(function(cb) { return cb !== fn; });
                    }
                  },
                  dispatchEvent: function() { return true; }
                };
              }
              return new OriginalWS(url, protocols);
            };
            window.WebSocket.prototype = OriginalWS.prototype;
            window.WebSocket.CONNECTING = 0;
            window.WebSocket.OPEN = 1;
            window.WebSocket.CLOSING = 2;
            window.WebSocket.CLOSED = 3;
          }

          window.addEventListener('unhandledrejection', function(event) {
            var reason = event && event.reason;
            var str = String(reason || '') + ' ' + (reason && reason.stack ? reason.stack : '');
            if (str.indexOf('WebSocket') !== -1 || str.indexOf('createWebSocketModuleRunnerTransport') !== -1 || str.indexOf('@vite/client') !== -1) {
              event.preventDefault();
              event.stopImmediatePropagation();
            }
          });
          window.addEventListener('error', function(event) {
            var str = String(event.message || '') + ' ' + String(event.filename || '');
            if (str.indexOf('WebSocket') !== -1 || str.indexOf('createWebSocketModuleRunnerTransport') !== -1 || str.indexOf('@vite/client') !== -1) {
              event.preventDefault();
              event.stopImmediatePropagation();
            }
          });
        }
      })();
    </script>
